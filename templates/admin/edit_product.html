{% extends 'admin/base.html' %}
{% block title %}Edit Product{% endblock %}
{% block admin_content %}
<div class="section-header">
    <h1 style="margin: 0;">Edit Product</h1>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline btn-sm">Back</a>
</div>

<form method="POST" style="max-width: 700px;">
    <div class="form-card">
        <h2><i class="fas fa-box-open"></i> Product Details</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control">{{ product.description }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" class="form-control" step="0.01" value="{{ product.price }}" required>
            </div>
            <div class="form-group">
                <label>Discount Price (₹)</label>
                <input type="number" name="discount_price" class="form-control" step="0.01" value="{{ product.discount_price if product.discount_price }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Stock</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category_id" class="form-control">
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {{ 'selected' if product.category_id == cat.id }}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Image URL</label>
            <input type="url" name="image_url" class="form-control" value="{{ product.image_url }}">
        </div>
        <div style="display: flex; gap: 24px; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" name="is_featured" style="width: auto;" {{ 'checked' if product.is_featured }}> Featured product
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" name="is_active" style="width: auto;" {{ 'checked' if product.is_active }}> Active
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Update Product</button>
    </div>
</form>
{% endblock %}
