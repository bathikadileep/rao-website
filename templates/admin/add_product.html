{% extends 'admin/base.html' %}
{% block title %}Add Product{% endblock %}
{% block admin_content %}
<div class="section-header">
    <h1 style="margin: 0;">Add Product</h1>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline btn-sm">Back</a>
</div>

<form method="POST" style="max-width: 700px;">
    <div class="form-card">
        <h2><i class="fas fa-box-open"></i> Product Details</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" class="form-control" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Discount Price (₹)</label>
                <input type="number" name="discount_price" class="form-control" step="0.01">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Stock</label>
                <input type="number" name="stock" class="form-control" value="0" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category_id" class="form-control">
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Image URL</label>
            <div style="display: flex; gap: 12px; align-items: flex-start;">
                <div style="flex: 1;">
                    <input type="text" name="image_url" id="image_url_input" class="form-control" placeholder="Paste image URL here..." oninput="handleImageInput(this)" onpaste="setTimeout(()=>handleImageInput(this), 50)" onchange="handleImageInput(this)">
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">
                        💡 <strong>How to get image:</strong> Search on <a href="https://images.google.com" target="_blank" style="color:#EF5B25;">Google Images</a> → right-click the image → choose <em>"Copy image address"</em> → paste here.
                    </p>
                </div>
                <!-- Live Preview -->
                <div id="img-preview-box" style="width: 110px; height: 110px; border: 2px dashed rgba(239,91,37,0.4); border-radius: 12px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(239,91,37,0.05);">
                    <div id="img-placeholder" style="text-align: center; color: var(--text-muted); font-size: 11px; padding: 8px;">
                        <i class="fas fa-image" style="font-size: 28px; margin-bottom: 4px; display: block;"></i>Preview
                    </div>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 24px; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" name="is_featured" style="width: auto;"> Featured product
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Add Product</button>
    </div>
</form>

<script>
function extractRealImageUrl(rawUrl) {
    if (!rawUrl) return '';
    rawUrl = rawUrl.strip ? rawUrl.strip() : rawUrl.trim();
    if (rawUrl.includes('google.') && rawUrl.includes('imgres')) {
        try {
            const urlObj = new URL(rawUrl);
            const imgurl = urlObj.searchParams.get('imgurl');
            if (imgurl) {
                return decodeURIComponent(imgurl);
            }
        } catch(e) {}
    }
    return rawUrl;
}

function handleImageInput(inputEl) {
    let val = inputEl.value;
    const cleanUrl = extractRealImageUrl(val);
    if (cleanUrl !== val) {
        inputEl.value = cleanUrl;
        val = cleanUrl;
    }
    const box = document.getElementById('img-preview-box');
    if (val && val.trim() !== '') {
        box.innerHTML = `<img id="img-preview" src="${val}" alt="Preview" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.parentElement.innerHTML='<div style=\'text-align:center; color:#EF4444; font-size:11px; padding:6px;\'><i class=\'fas fa-exclamation-triangle\' style=\'font-size:24px; margin-bottom:4px; display:block;\'></i>Cannot load image</div>';">`;
    } else {
        box.innerHTML = `<div id="img-placeholder" style="text-align: center; color: var(--text-muted); font-size: 11px; padding: 8px;"><i class="fas fa-image" style="font-size: 28px; margin-bottom: 4px; display: block;"></i>Preview</div>`;
    }
}
</script>
{% endblock %}
