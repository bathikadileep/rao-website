{% extends 'base.html' %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if request.endpoint == 'admin.dashboard' }}"><i class="fas fa-chart-line"></i> Overview</a>
        <a href="{{ url_for('admin.products') }}" class="{{ 'active' if request.endpoint in ['admin.products', 'admin.add_product', 'admin.edit_product'] }}"><i class="fas fa-mobile-screen-button"></i> Phones</a>
        <a href="{{ url_for('admin.services') }}" class="{{ 'active' if request.endpoint in ['admin.services', 'admin.add_service', 'admin.edit_service'] }}"><i class="fas fa-tools"></i> Services</a>
        <a href="{{ url_for('admin.bookings') }}" class="{{ 'active' if request.endpoint in ['admin.bookings'] }}"><i class="fas fa-calendar-check"></i> Bookings</a>
        <a href="{{ url_for('admin.orders') }}" class="{{ 'active' if request.endpoint in ['admin.orders'] }}"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a href="{{ url_for('admin.users') }}" class="{{ 'active' if request.endpoint in ['admin.users', 'admin.customer_detail'] }}"><i class="fas fa-users"></i> Customers</a>
        <a href="{{ url_for('admin.categories') }}" class="{{ 'active' if request.endpoint == 'admin.categories' }}"><i class="fas fa-tags"></i> Categories</a>
    </aside>
    <div class="admin-content">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
