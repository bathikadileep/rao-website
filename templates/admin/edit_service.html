{% extends 'admin/base.html' %}
{% block title %}Edit Service{% endblock %}
{% block admin_content %}
<div class="section-header">
    <h1 style="margin: 0;">Edit Service</h1>
    <a href="{{ url_for('admin.services') }}" class="btn btn-outline btn-sm">Back</a>
</div>

<form method="POST" style="max-width: 700px;">
    <div class="form-card">
        <h2><i class="fas fa-tools"></i> Service Details</h2>
        <div class="form-group">
            <label>Service Name</label>
            <input type="text" name="name" class="form-control" value="{{ service.name }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control">{{ service.description }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" class="form-control" step="0.01" value="{{ service.price }}" required>
            </div>
            <div class="form-group">
                <label>Estimated Time</label>
                <input type="text" name="estimated_time" class="form-control" value="{{ service.estimated_time }}">
            </div>
        </div>
        <div class="form-group">
            <label>Icon (Font Awesome class)</label>
            <input type="text" name="image_icon" class="form-control" value="{{ service.image_icon }}">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" name="is_active" style="width: auto;" {{ 'checked' if service.is_active }}> Active
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Update Service</button>
    </div>
</form>
{% endblock %}
