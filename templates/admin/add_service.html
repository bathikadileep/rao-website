{% extends 'admin/base.html' %}
{% block title %}Add Service{% endblock %}
{% block admin_content %}
<div class="section-header">
    <h1 style="margin: 0;">Add Service</h1>
    <a href="{{ url_for('admin.services') }}" class="btn btn-outline btn-sm">Back</a>
</div>

<form method="POST" style="max-width: 700px;">
    <div class="form-card">
        <h2><i class="fas fa-tools"></i> Service Details</h2>
        <div class="form-group">
            <label>Service Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Screen Replacement" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" class="form-control" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Estimated Time</label>
                <input type="text" name="estimated_time" class="form-control" placeholder="e.g. 1-2 hours">
            </div>
        </div>
        <div class="form-group">
            <label>Icon (Font Awesome class)</label>
            <input type="text" name="image_icon" class="form-control" value="fa-mobile-screen" placeholder="fa-mobile-screen, fa-battery-full, etc.">
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Add Service</button>
    </div>
</form>
{% endblock %}
