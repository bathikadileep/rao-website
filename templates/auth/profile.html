{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; padding: 40px 24px;">
    <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 32px;">My Profile</h1>

    <form method="POST">
        <div class="form-card">
            <h2><i class="fas fa-user"></i> Personal Info</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ current_user.phone }}" placeholder="+91 98765 43210">
            </div>
        </div>

        <div class="form-card">
            <h2><i class="fas fa-location-dot"></i> Address</h2>
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" class="form-control" placeholder="Street address">{{ current_user.address }}</textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city" class="form-control" value="{{ current_user.city }}">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="state" class="form-control" value="{{ current_user.state }}">
                </div>
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" name="pincode" class="form-control" value="{{ current_user.pincode }}" maxlength="6">
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
    </form>
</div>
{% endblock %}
