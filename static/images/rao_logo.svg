<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D7BFF"/>
      <stop offset="50%" stop-color="#6B46C1"/>
      <stop offset="100%" stop-color="#4C2889"/>
    </linearGradient>
    <linearGradient id="orangeSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#EF5B25"/>
      <stop offset="100%" stop-color="#E03A00"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF5B25" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Glowing Orbit Ring (Vivid Orange Gradient) -->
  <path d="M 165 50 A 80 80 0 1 1 45 165 A 72 72 0 0 0 172 65 Z" fill="url(#orangeSwoosh)" filter="url(#logoGlow)"/>
  
  <!-- Inner Metallic Purple Frame -->
  <circle cx="100" cy="100" r="70" fill="#140A2C" stroke="url(#purpleRing)" stroke-width="10"/>
  
  <!-- Crisp Bright White Capital R Letter -->
  <path d="M 72 55 L 122 55 C 142 55 142 90 122 90 L 98 90 L 132 145 L 108 145 L 78 95 L 78 145 L 62 145 L 62 55 Z M 78 70 L 78 80 L 118 80 C 126 80 126 70 118 70 Z" fill="#FFFFFF"/>
  
  <!-- Vibrant Orange Inner Accent Triangle -->
  <path d="M 78 102 L 98 102 L 78 132 Z" fill="url(#orangeSwoosh)"/>
</svg>
